[package]
name = "snapper-app"
description = "Snapper desktop tray app and editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snapper-core = { path = "../snapper-core" }
snapper-capture = { path = "../snapper-capture" }
snapper-editor = { path = "../snapper-editor" }
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1"
arboard = "3"
# 4.18 is the first 4.x release whose Windows toasts report a click.
notify-rust = "4.18"
opener = "0.7"
chrono = "0.4"
