[package]
name = "snapper-record"
description = "GIF and MP4 screen recording for Snapper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snapper-core = { path = "../snapper-core" }
snapper-capture = { path = "../snapper-capture" }
